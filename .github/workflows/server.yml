name: Server

on:
  push:
    branches: [main]
    paths: ["api/**"]
  pull_request:
    paths: ["api/**"]

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest -v
